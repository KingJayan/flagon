<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flagon — runtime sandbox</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/src/shell.css" />
  </head>
  <body>
    <main id="app" data-state="loading">
      <header class="masthead">
        <img class="mark" src="/logo.png" alt="" width="44" height="44" />
        <div>
          <h1>Flagon</h1>
          <p class="tagline">A desktop Java/LWJGL environment for the browser.</p>
        </div>
      </header>

      <section class="controls">
        <div class="row">
          <label for="bundle">Bundle</label>
          <select id="bundle">
            <option value="sandbox">sandbox</option>
            <option value="example">example</option>
          </select>
          <label for="backend">Backend</label>
          <select id="backend">
            <option value="wasm">wasm</option>
            <option value="js">js</option>
          </select>
          <label for="program">Program</label>
          <select id="program">
            <option value="">the bundle's first program</option>
          </select>
          <button id="run" type="button">Run</button>
          <button id="stop" type="button" disabled>Stop</button>
          <span id="state" class="badge" data-testid="state">loading</span>
          <span id="rate" class="badge" data-testid="rate" hidden></span>
        </div>
        <ol id="phases" class="phases" data-testid="phases"></ol>
      </section>

      <section class="stage" id="display">
        <h2>Display</h2>
        <canvas id="flagon-canvas" width="640" height="360"></canvas>
      </section>

      <section class="console">
        <h2>Console</h2>
        <pre id="log" class="log" data-testid="log"></pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
