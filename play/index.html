<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flagon</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
    <script type="module" crossorigin src="/assets/play-u4Yv8XzS.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/assets/log-Dx_juzxH.js">
    <link rel="modulepreload" crossorigin href="/assets/stopping-yLE0-Kxw.js">
    <link rel="stylesheet" crossorigin href="/assets/play-Cj4KDw5N.css">
  </head>
  <body>
    <canvas id="flagon-canvas" width="854" height="480" aria-label="the running program"></canvas>

    <div id="controls" class="controls" data-testid="controls" aria-label="program controls">
      <button id="stop" type="button" data-testid="stop" disabled>Stop</button>
      <button id="fullscreen" type="button" data-testid="fullscreen">Fullscreen</button>
      <button id="output" type="button" data-testid="output" aria-expanded="false">Output</button>
      <span id="rate" class="badge" data-testid="rate" role="status" hidden></span>
      <a class="away" href="/">Shell</a>
    </div>

    <pre id="log" class="log" data-testid="log" hidden aria-label="program output"></pre>

    <p id="hint" class="hint" data-testid="hint" hidden role="status"></p>

    <div id="veil" class="veil" data-testid="veil" role="status">
      <p class="headline" id="headline" data-testid="headline">Starting</p>
      <p class="detail" id="detail" data-testid="detail"></p>
    </div>

  </body>
</html>
