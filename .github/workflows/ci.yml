name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check java style
        run: ./gradlew lintJava

      - name: Unit tests
        run: make test

      - name: Build backends
        run: make bundles

      - name: Upload bundles
        uses: actions/upload-artifact@v5
        with:
          name: bundles
          path: web/public/flagon/
          retention-days: 1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/web-deps

      - name: Lint
        run: cd web && bun run lint

      - name: Typecheck
        run: make typecheck

      - name: Build site
        run: make build-site

      - name: Upload site
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: web/dist/
          retention-days: 1

  browser:
    needs: [build, web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # keep the tag in step with @playwright/test in web/bun.lock
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, shard: 1, shards: 3 }
          - { project: chromium, shard: 2, shards: 3 }
          - { project: chromium, shard: 3, shards: 3 }
          - { project: firefox, shard: 1, shards: 1 }
          - { project: served, shard: 1, shards: 1 }
    steps:
      - uses: actions/checkout@v5

      - name: Download bundles
        uses: actions/download-artifact@v5
        with:
          name: bundles
          path: web/public/flagon/

      - name: Download site
        uses: actions/download-artifact@v5
        with:
          name: site
          path: web/dist/

      - name: Put the bundles in the site
        run: mkdir -p web/dist/flagon && cp -R web/public/flagon/. web/dist/flagon/

      - uses: ./.github/actions/web-deps

      - name: Browser tests
        run: cd web && bunx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }}

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: web/blob-report/
          retention-days: 7

  report:
    needs: browser
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Download reports
        uses: actions/download-artifact@v5
        with:
          path: web/blob-report/
          pattern: blob-report-*
          merge-multiple: true

      - uses: ./.github/actions/web-deps

      - name: Merge reports
        run: make merge-reports

      - uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
