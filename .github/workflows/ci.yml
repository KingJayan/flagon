name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['*.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check java style
        run: ./gradlew lintJava

      - name: Unit tests
        run: make test

      # main deploys, so it builds and tests the release bundles the site serves
      - uses: ./.github/actions/web-deps
        if: github.event_name == 'push'

      - name: Build backends
        run: make ${{ github.event_name == 'push' && 'bundles-release' || 'bundles' }}

      - name: Upload bundles
        uses: actions/upload-artifact@v5
        with:
          name: bundles
          path: web/public/flagon/
          retention-days: 1

  # javac and teavm compiled to wasm change rarely, so the cache skips the 2-minute build
  playground:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - id: cache
        uses: actions/cache@v4
        with:
          path: playground/compiler/build/dist
          key: playground-${{ hashFiles('playground/**', 'gradle/wrapper/gradle-wrapper.properties') }}

      - uses: actions/setup-java@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Build the playground compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./gradlew -p playground :compiler:dist

      - uses: actions/upload-artifact@v5
        with:
          name: playground
          path: playground/compiler/build/dist/
          retention-days: 1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/web-deps

      - name: Lint
        run: cd web && bun run lint

      - name: Typecheck
        run: make typecheck

      - name: Build site
        run: make build-site

      - name: Upload site
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: web/dist/
          retention-days: 1

  browser:
    needs: [build, web, playground]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # keep the tag in step with @playwright/test in web/bun.lock
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, shard: 1, shards: 3 }
          - { project: chromium, shard: 2, shards: 3 }
          - { project: chromium, shard: 3, shards: 3 }
          - { project: firefox, shard: 1, shards: 1 }
          - { project: served, shard: 1, shards: 1 }
    steps:
      - uses: actions/checkout@v5

      - name: Download bundles
        uses: actions/download-artifact@v5
        with:
          name: bundles
          path: web/public/flagon/

      - name: Download playground
        uses: actions/download-artifact@v5
        with:
          name: playground
          path: web/public/flagon/playground/

      - name: Download site
        uses: actions/download-artifact@v5
        with:
          name: site
          path: web/dist/

      - name: Put the bundles in the site
        run: mkdir -p web/dist/flagon && cp -R web/public/flagon/. web/dist/flagon/

      - uses: ./.github/actions/web-deps

      - name: Browser tests
        run: cd web && bunx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }}

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: web/blob-report/
          retention-days: 7

  site:
    needs: browser
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: site/

      - uses: actions/download-artifact@v5
        with:
          name: bundles
          path: site/flagon/

      - uses: actions/download-artifact@v5
        with:
          name: playground
          path: site/flagon/playground/

      # vercel deploys the site branch as it is; main's vercel.json keeps every other branch off
      - name: Push the site branch
        working-directory: site
        run: |
          echo '{ "git": { "deploymentEnabled": true } }' > vercel.json
          git init -q -b site
          git add .
          # vercel's hobby plan deploys only commits by a linked account, so the pusher signs it
          git -c user.name='${{ github.actor }}' \
            -c user.email='${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com' \
            commit -q -m "site $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site

  report:
    needs: browser
    if: failure() && needs.browser.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Download reports
        uses: actions/download-artifact@v5
        with:
          path: web/blob-report/
          pattern: blob-report-*
          merge-multiple: true

      - uses: ./.github/actions/web-deps

      - name: Merge reports
        run: make merge-reports

      - uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
