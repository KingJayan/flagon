name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Fetch maven
        run: for attempt in 1 2 3; do ./mvnw -B -v && exit 0; sleep 10; done; exit 1

      - name: Build and unit test both backends
        run: make build

      - name: Upload the bundles
        uses: actions/upload-artifact@v5
        with:
          name: bundles
          path: web/public/flagon/
          retention-days: 1

  browser:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            shard: 1
            shards: 4
          - project: chromium
            shard: 2
            shards: 4
          - project: chromium
            shard: 3
            shards: 4
          - project: chromium
            shard: 4
            shards: 4
          - project: firefox
            shard: 1
            shards: 1
    steps:
      - uses: actions/checkout@v5

      - name: Download the bundles
        uses: actions/download-artifact@v5
        with:
          name: bundles
          path: web/public/flagon/

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache the bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install web dependencies
        run: make deps

      - name: Typecheck and build the shell
        run: make site

      - name: Resolve the playwright version
        id: playwright
        run: echo "version=$(cd web && bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache the browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-${{ matrix.project }}-

      - name: Install the browser
        run: make browser-${{ matrix.project }}

      - name: Browser tests
        run: make browser ARGS="--project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }}"

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: web/blob-report/
          retention-days: 7

  report:
    needs: browser
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache the bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install web dependencies
        run: make deps

      - name: Download the shard reports
        uses: actions/download-artifact@v5
        with:
          path: web/blob-report/
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge the shard reports
        run: make merge-reports

      - uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
