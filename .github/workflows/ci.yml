name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Fetch maven
        run: for attempt in 1 2 3; do ./mvnw -B -v && exit 0; sleep 10; done; exit 1

      - name: Build and unit test
        run: ./mvnw -B package

      - name: Build the JavaScript bundles
        run: ./mvnw -B -Pjs -DskipTests package

      - name: Upload the bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: web/public/flagon/
          retention-days: 1

  browser:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Download the bundles
        uses: actions/download-artifact@v4
        with:
          name: bundles
          path: web/public/flagon/

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache the bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck and build the shell
        working-directory: web
        run: bun run build

      # the download is what costs; the system packages are apt's and cannot be cached
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install Chromium
        working-directory: web
        run: |
          bunx playwright install-deps chromium
          bunx playwright install chromium

      - name: Browser tests
        working-directory: web
        run: bunx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: blob-report-${{ matrix.shard }}
          path: web/blob-report/
          retention-days: 7

  report:
    needs: browser
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache the bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Download the shard reports
        uses: actions/download-artifact@v4
        with:
          path: web/blob-report/
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge the shard reports
        working-directory: web
        run: bunx playwright merge-reports --reporter html ./blob-report

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
