name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # wasm-opt comes from the binaryen package
      - uses: ./.github/actions/web-deps

      - name: Set version from tag
        run: make version VERSION="${GITHUB_REF_NAME#v}"

      - name: Build release bundles
        run: make bundles-release

      - name: Weigh bundles
        run: |
          { echo '```'; make -s size; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the bundles
        uses: actions/upload-artifact@v5
        with:
          name: release-bundles
          path: web/public/flagon/
          retention-days: 1

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/web-deps

      - name: Typecheck and build
        run: make typecheck build-site

      - name: Upload site
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: web/dist/
          retention-days: 1

  browser:
    needs: [bundles, site]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # keep the tag in step with @playwright/test in web/bun.lock
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, shard: 1, shards: 3 }
          - { project: chromium, shard: 2, shards: 3 }
          - { project: chromium, shard: 3, shards: 3 }
          - { project: firefox, shard: 1, shards: 1 }
          - { project: served, shard: 1, shards: 1 }
    steps:
      - uses: actions/checkout@v5

      - name: Download bundles
        uses: actions/download-artifact@v5
        with:
          name: release-bundles
          path: web/public/flagon/

      - name: Download site
        uses: actions/download-artifact@v5
        with:
          name: site
          path: web/dist/

      - name: Put the bundles in the site
        run: mkdir -p web/dist/flagon && cp -R web/public/flagon/. web/dist/flagon/

      - uses: ./.github/actions/web-deps

      - name: Browser tests
        run: cd web && bunx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }}

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: web/blob-report/
          retention-days: 7

  publish:
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version from tag
        run: make version VERSION="${GITHUB_REF_NAME#v}"

      - name: Publish
        run: make publish
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  site-branch:
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: site/

      - uses: actions/download-artifact@v5
        with:
          name: release-bundles
          path: site/flagon/

      # vercel deploys the site branch as it is; main's vercel.json keeps every other branch off
      - name: Push the site branch
        working-directory: site
        run: |
          echo '{ "git": { "deploymentEnabled": true } }' > vercel.json
          git init -q -b site
          git add .
          # vercel's hobby plan deploys only commits by a linked account, so the tag's pusher signs it
          git -c user.name='${{ github.actor }}' \
            -c user.email='${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com' \
            commit -q -m "site $GITHUB_REF_NAME"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site
