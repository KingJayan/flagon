name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version (from tag)
        run: make version VERSION="${GITHUB_REF_NAME#v}"

      - name: Build & test as release
        run: make build-release

      - name: Upload the bundles
        uses: actions/upload-artifact@v5
        with:
          name: release-bundles
          path: web/public/flagon/
          retention-days: 1

  browser:
    needs: bundles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - name: Download bundles
        uses: actions/download-artifact@v5
        with:
          name: release-bundles
          path: web/public/flagon/

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun pckgs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install web deps
        run: make deps

      - name: Typecheck & build
        run: make site

      - name: Cache browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install browsers
        run: make browsers

      - name: Browser tests
        run: make browser ARGS="--shard=${{ matrix.shard }}/${{ strategy.job-total }}"

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: blob-report-${{ matrix.shard }}
          path: web/blob-report/
          retention-days: 7

  publish:
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version from tag
        run: make version VERSION="${GITHUB_REF_NAME#v}"

      - name: Build
        run: make bundles-release

      - name: Publish
        run: make publish
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
