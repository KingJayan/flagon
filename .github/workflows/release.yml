name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - uses: ./.github/actions/web-deps

      - name: Set version from tag
        run: make version VERSION="${GITHUB_REF_NAME#v}"

      - name: Build release bundles
        run: make bundles-release

      - name: Weigh bundles
        run: |
          { echo '```'; make -s size; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the bundles
        uses: actions/upload-artifact@v5
        with:
          name: release-bundles
          path: web/public/flagon/
          retention-days: 1

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ci already ran the browser suite on main, so require its green run
      # instead of running it again. ci skips doc-only commits, so walk back
      # to the nearest commit it ran on and allow only ignored paths since.
      - name: Require a green ci run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ignored='^([^/]+\.md|web/docs/images/.*|LICENSE)$'
          for sha in $(git rev-list --first-parent -n 50 "$GITHUB_SHA"); do
            runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push"
            # the version bump's own run starts with the tag, so wait for it
            while [ "$(gh api "$runs" --jq '[.workflow_runs[] | select(.status != "completed")] | length')" != 0 ]; do
              sleep 30
            done
            result=$(gh api "$runs" \
              --jq '[.workflow_runs[] | select(.status == "completed")] | sort_by(.run_attempt) | last | .conclusion // ""')
            if [ -z "$result" ]; then continue; fi
            if [ "$result" != success ]; then
              echo "::error::ci on $sha concluded $result"; exit 1
            fi
            if git diff --name-only "$sha" "$GITHUB_SHA" | grep -Ev "$ignored"; then
              echo "::error::files above changed since the green ci run on $sha"; exit 1
            fi
            echo "ci passed on $sha"; exit 0
          done
          echo "::error::no completed ci run found for $GITHUB_SHA or its recent ancestors"; exit 1

  publish:
    needs: [bundles, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version from tag
        run: make version VERSION="${GITHUB_REF_NAME#v}"

      - name: Build a bundle outside this build
        run: make standalone

      - name: Publish
        run: make publish
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
