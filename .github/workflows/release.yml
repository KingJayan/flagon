name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # jitpack.io builds and publishes from the tagged commit itself on first request;
  # this job just proves the tag builds before anyone depends on it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # the tag is the version. the poms carry the next release as a snapshot between tags,
      # so nothing has to be committed to cut one.
      - name: Set the version from the tag
        run: ./mvnw -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build and test
        run: ./mvnw -B package
