name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Fetch maven
        run: for attempt in 1 2 3; do ./mvnw -B -v && exit 0; sleep 10; done; exit 1

      # the tag is the version. the poms carry the next release as a snapshot between tags,
      # so nothing has to be committed to cut one.
      - name: Set the version from the tag
        run: make version VERSION="${GITHUB_REF_NAME#v}"

      - name: Build and test
        run: make bundles-release

      - name: Publish to GitHub Packages
        run: make publish
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
