name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Fetch maven
        run: for attempt in 1 2 3; do ./mvnw -B -v && exit 0; sleep 10; done; exit 1

      # the tag is the version. the poms carry the next release as a snapshot between tags,
      # so nothing has to be committed to cut one.
      - name: Set the version from the tag
        run: make version VERSION="${GITHUB_REF_NAME#v}"

      - name: Build and unit test both backends as they ship
        run: make build-release

      - name: Upload the bundles
        uses: actions/upload-artifact@v5
        with:
          name: release-bundles
          path: web/public/flagon/
          retention-days: 1

  # what gets published is optimized and minified, which is not what ci built or drove
  browser:
    needs: bundles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - name: Download the bundles
        uses: actions/download-artifact@v5
        with:
          name: release-bundles
          path: web/public/flagon/

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache the bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install web dependencies
        run: make deps

      - name: Typecheck and build the shell
        run: make site

      - name: Cache the browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install the browsers
        run: make browsers

      - name: Browser tests
        run: make browser ARGS="--shard=${{ matrix.shard }}/${{ strategy.job-total }}"

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: blob-report-${{ matrix.shard }}
          path: web/blob-report/
          retention-days: 7

  publish:
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Fetch maven
        run: for attempt in 1 2 3; do ./mvnw -B -v && exit 0; sleep 10; done; exit 1

      - name: Set the version from the tag
        run: make version VERSION="${GITHUB_REF_NAME#v}"

      - name: Build what the tag ships
        run: make bundles-release

      - name: Publish to GitHub Packages
        run: make publish
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
